<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11313C">
<meta name="description" content="The weather, plus an honest opinion about it.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Is It Nice Out?</title>
</head>
<body>

<header class="bar">
  <button class="pill" id="place-btn">
    <span id="place">Finding you</span>
    <span class="caret">▾</span>
  </button>
  <div class="bar-r">
    <button class="ico" id="share" title="Share">↗</button>
    <button class="ico" id="units" title="Units">°</button>
    <button class="ico" id="refresh" title="Refresh">⟳</button>
  </div>
</header>

<!-- places drawer -->
<section class="drawer" id="drawer" hidden>
  <input id="q" aria-label="Search for a town, city or coordinates" placeholder="Town, city, or 52.06, -1.34" autocomplete="off" enterkeyhint="search">
  <div id="hits"></div>
  <div class="saved-label" id="saved-label" hidden>Saved places</div>
  <div id="saved"></div>
  <button class="wide" id="use-gps">Use my current location</button>
</section>

<div id="offline-note" class="stale" hidden></div>

<main id="app">
  <div class="boot">
    <div class="boot-dot"></div>
    Reading the sky
  </div>
</main>

<footer class="foot">
  Weather from Open-Meteo · no account, no tracking
</footer>

<script src="jokes.js"></script>
<script src="app.js"></script>
</body>
</html>
